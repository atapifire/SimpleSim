<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Tetris</title><style>
body { background-color: #2f2f2f; color: #fff; font-family: Arial, sans-serif; } #game-canvas { border: 1px solid #fff; } #score { position: absolute; top: 10px; left: 10px; font-size: 24px; }
</style>
</head><body><canvas id='game-canvas' width='200' height='400'></canvas><div id='score'>Score: 0</div><script>
const canvas = document.getElementById('game-canvas'); const ctx = canvas.getContext('2d'); const scoreElement = document.getElementById('score'); const pieceTypes = ['I', 'O', 'T', 'S', 'Z', 'J', 'L']; const pieceColors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffffff']; const pieceShapes = { I: [[1, 1, 1, 1]], O: [[1, 1], [1, 1]], T: [[0, 1, 0], [1, 1, 1]], S: [[0, 1, 1], [1, 1, 0]], Z: [[1, 1, 0], [0, 1, 1]], J: [[1, 0, 0], [1, 1, 1]], L: [[0, 0, 1], [1, 1, 1]] }; let currentPiece = { type: pieceTypes[Math.floor(Math.random() * pieceTypes.length)], x: 3, y: 0, rotation: 0 }; let gameBoard = Array(20).fill(0).map(() => Array(10).fill(0)); let score = 0; let gameOver = false; function drawGameBoard() { ctx.clearRect(0, 0, canvas.width, canvas.height); for (let y = 0; y < 20; y++) { for (let x = 0; x < 10; x++) { if (gameBoard[y][x] !== 0) { ctx.fillStyle = pieceColors[gameBoard[y][x] - 1]; ctx.fillRect(x * 20, y * 20, 20, 20); } } } } function drawCurrentPiece() { const shape = pieceShapes[currentPiece.type]; const rotatedShape = rotateShape(shape, currentPiece.rotation); for (let y = 0; y < rotatedShape.length; y++) { for (let x = 0; x < rotatedShape[y].length; x++) { if (rotatedShape[y][x] === 1) { ctx.fillStyle = pieceColors[pieceTypes.indexOf(currentPiece.type)]; ctx.fillRect((currentPiece.x + x) * 20, (currentPiece.y + y) * 20, 20, 20); } } } } function rotateShape(shape, rotation) { if (rotation === 0) return shape; if (rotation === 1) return shape[0].map((_, colIndex) => shape.map(row => row[colIndex]).reverse()); if (rotation === 2) return shape.reverse().map(row => row.reverse()); if (rotation === 3) return shape.map((_, colIndex) => shape.map(row => row[colIndex])).reverse(); } function checkCollision(x, y, rotation) { const shape = pieceShapes[currentPiece.type]; const rotatedShape = rotateShape(shape, rotation); for (let dy = 0; dy < rotatedShape.length; dy++) { for (let dx = 0; dx < rotatedShape[dy].length; dx++) { if (rotatedShape[dy][dx] === 1) { if (x + dx < 0 || x + dx >= 10 || y + dy >= 20) return true; if (y + dy >= 0 && gameBoard[y + dy][x + dx] !== 0) return true; } } } return false; } function updateGameBoard() { if (checkCollision(currentPiece.x, currentPiece.y + 1, currentPiece.rotation)) { const shape = pieceShapes[currentPiece.type]; const rotatedShape = rotateShape(shape, currentPiece.rotation); for (let y = 0; y < rotatedShape.length; y++) { for (let x = 0; x < rotatedShape[y].length; x++) { if (rotatedShape[y][x] === 1) { gameBoard[currentPiece.y + y][currentPiece.x + x] = pieceTypes.indexOf(currentPiece.type) + 1; } } } checkForLineClears(); currentPiece = { type: pieceTypes[Math.floor(Math.random() * pieceTypes.length)], x: 3, y: 0, rotation: 0 }; if (checkCollision(currentPiece.x, currentPiece.y, currentPiece.rotation)) { gameOver = true; } } else { currentPiece.y++; } } function checkForLineClears() { for (let y = 0; y < 20; y++) { let lineClear = true; for (let x = 0; x < 10; x++) { if (gameBoard[y][x] === 0) { lineClear = false; break; } } if (lineClear) { gameBoard.splice(y, 1); gameBoard.unshift(Array(10).fill(0)); score++; scoreElement.textContent = `Score: ${score}`; } } } function handleInput(event) { if (event.key === 'ArrowLeft') { if (!checkCollision(currentPiece.x - 1, currentPiece.y, currentPiece.rotation)) { currentPiece.x--; } } if (event.key === 'ArrowRight') { if (!checkCollision(currentPiece.x + 1, currentPiece.y, currentPiece.rotation)) { currentPiece.x++; } } if (event.key === 'ArrowDown') { updateGameBoard(); } if (event.key === 'ArrowUp') { if (!checkCollision(currentPiece.x, currentPiece.y, (currentPiece.rotation + 1) % 4)) { currentPiece.rotation = (currentPiece.rotation + 1) % 4; } } } document.addEventListener('keydown', handleInput); function gameLoop() { if (!gameOver) { updateGameBoard(); drawGameBoard(); drawCurrentPiece(); } else { ctx.font = '24px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2); } requestAnimationFrame(gameLoop); } gameLoop();
</script>
</body></html>
