<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Counter App</title><style>
.container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }.buttons { margin-top: 20px; }.buttons button { width: 50px; height: 50px; font-size: 24px; margin: 10px; border: none; border-radius: 10px; background-color: #4CAF50; color: #fff; cursor: pointer; }.buttons button:hover { background-color: #3e8e41; }#count { font-size: 64px; font-weight: bold; }
</style>
</head><body><div class='container'><h1 id='count'>0</h1><div class='buttons'><button id='increment'>+</button><button id='decrement'>-</button><button id='reset'>Reset</button></div></div><script>
let count = 0;const countElement = document.getElementById('count');const incrementButton = document.getElementById('increment');const decrementButton = document.getElementById('decrement');const resetButton = document.getElementById('reset');incrementButton.addEventListener('click', () => { count++; updateCount(); });decrementButton.addEventListener('click', () => { count--; updateCount(); });resetButton.addEventListener('click', () => { count = 0; updateCount(); });function updateCount() { countElement.textContent = count; }
</script>
</body></html>
