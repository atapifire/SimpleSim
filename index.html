<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SimpleSim [DEV]</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Fira+Code:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module" src="security.js"></script>
</head>
<body class="bg-gray-900 text-white h-screen w-screen overflow-hidden font-inter">

    <!-- Main Viewport (Preview) -->
    <div id="preview-container" class="absolute inset-0 z-0 bg-white transition-opacity duration-300">
        <iframe id="site-preview" class="w-full h-full border-0" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
        
        <!-- Project Loading State -->
        <div id="project-loader" class="absolute inset-0 flex items-center justify-center bg-white z-20 hidden">
             <div class="loader border-gray-200 border-b-blue-500"></div>
        </div>

        <!-- Empty State / Welcome -->
        <div id="welcome-screen" class="absolute inset-0 flex flex-col items-center justify-center text-gray-800 bg-gray-50 p-6 text-center z-10">
            <div class="mb-8 p-4 bg-white rounded-2xl shadow-xl animate-float">
                <i class="fa-solid fa-wand-magic-sparkles text-4xl text-purple-600 mb-4"></i>
                <h1 class="text-2xl font-bold mb-2">SimpleSim</h1>
                <p class="text-gray-500 text-sm">Describe it. Build it.</p>
            </div>
            <div class="space-y-4 max-w-md w-full">
                <p class="text-gray-600">Try saying...</p>
                <button type="button" class="suggestion-chip w-full bg-white p-3 rounded-xl shadow-sm border border-gray-200 text-left hover:bg-gray-50 transition-colors text-sm text-gray-700" data-prompt="A personal portfolio for a photographer with a dark theme and masonry gallery">
                    "A photographer's portfolio with dark mode"
                </button>
                <button type="button" class="suggestion-chip w-full bg-white p-3 rounded-xl shadow-sm border border-gray-200 text-left hover:bg-gray-50 transition-colors text-sm text-gray-700" data-prompt="A retro 80s synthwave landing page with neon text effects">
                    "Retro 80s synthwave landing page"
                </button>
                <button type="button" class="suggestion-chip w-full bg-white p-3 rounded-xl shadow-sm border border-gray-200 text-left hover:bg-gray-50 transition-colors text-sm text-gray-700" data-prompt="A simple interactive calculator app with pastel colors">
                    "Pastel interactive calculator"
                </button>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="absolute inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center">
            <div class="loader mb-4"></div>
            <p id="loading-text" class="text-white font-mono text-sm animate-pulse">Generating code...</p>
        </div>
    </div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer" class="absolute inset-0 pointer-events-none z-20 flex flex-col justify-end">

        <!-- Thinking Region (above input bar) -->
        <div id="thinking-container" class="pointer-events-auto mx-4 mb-2 max-w-4xl w-full self-center hidden">
            <div id="thinking-bar" class="bg-gray-900/90 backdrop-blur-lg border border-gray-700/50 rounded-xl overflow-hidden cursor-pointer transition-all duration-300" style="max-height: 40px;">
                <div class="p-2 flex items-center gap-2">
                    <div class="flex items-center gap-2 shrink-0">
                        <div id="thinking-indicator" class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div>
                        <span class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold">Thinking</span>
                    </div>
                    <div id="thinking-scroll" class="flex-1 overflow-hidden relative h-5">
                        <div id="thinking-text" class="absolute whitespace-nowrap text-xs text-gray-400 animate-scroll-left"></div>
                    </div>
                    <button id="thinking-expand" class="shrink-0 w-6 h-6 flex items-center justify-center text-gray-500 hover:text-white transition-colors rounded">
                        <i class="fa-solid fa-chevron-up text-[10px] transition-transform duration-300"></i>
                    </button>
                </div>
                <div id="thinking-expanded" class="hidden px-3 pb-3">
                    <div id="thinking-log" class="bg-gray-950/50 rounded-lg p-2 max-h-40 overflow-y-auto custom-scrollbar font-mono text-[11px] text-gray-400 space-y-1"></div>
                </div>
            </div>
        </div>
        
        <!-- Bottom Container (Wraps History + Input) -->
        <div id="bottom-bar-container" class="pointer-events-auto p-4 w-full max-w-4xl mx-auto transition-all duration-300 flex flex-col justify-end">
            
            <!-- Version History Panel (Now above input) -->
            <div id="history-panel" class="bg-gray-900/95 backdrop-blur-xl border border-gray-700 rounded-t-2xl rounded-b-none shadow-2xl transform translate-y-full opacity-0 pointer-events-none transition-all duration-300 max-h-[40vh] flex flex-col origin-bottom mb-[-1px] border-b-0 mx-2 z-0">
                <div id="history-handle" class="px-4 py-3 flex justify-between items-center border-b border-white/5 cursor-pointer select-none hover:bg-white/5 transition-colors rounded-t-2xl">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-code-branch text-blue-400 text-xs"></i>
                        <h2 class="text-xs font-semibold text-gray-300 uppercase tracking-wider">Project Timeline</h2>
                        <span class="text-[9px] text-gray-500 font-normal normal-case">oldest → newest</span>
                    </div>
                    <button type="button" id="close-history" class="text-gray-500 hover:text-white transition-colors w-6 h-6 flex items-center justify-center rounded-full hover:bg-white/10"><i class="fa-solid fa-times text-xs"></i></button>
                </div>
                <div id="history-list" class="overflow-y-auto p-2 space-y-2 flex-1 custom-scrollbar">
                    <!-- History items injected here -->
                </div>
            </div>

            <!-- Main Input Bar -->
            <div class="bg-gray-800/90 backdrop-blur-lg border border-gray-700 rounded-2xl shadow-2xl p-2 relative overflow-visible ring-1 ring-white/10 z-10 transition-all duration-300" id="input-bar">

                <!-- Top Row: Project & Controls -->
                <div class="flex items-center gap-1.5 sm:gap-2 mb-2">
                    <!-- Project Selector -->
                    <div class="flex items-center bg-gray-900/60 rounded-xl border border-gray-700/50 p-0.5 sm:p-1 h-8 sm:h-10 flex-shrink min-w-0">
                        <button type="button" id="btn-project-label" class="px-2 sm:px-3 h-full flex items-center gap-1 sm:gap-2 text-[11px] sm:text-xs font-medium text-gray-300 hover:text-white transition-colors max-w-[100px] sm:max-w-[160px] rounded hover:bg-white/5">
                            <span id="current-project-name" class="truncate">New Project</span>
                            <i class="fa-solid fa-chevron-down text-[8px] sm:text-[10px] opacity-50 shrink-0"></i>
                        </button>
                        <div class="w-px h-3 sm:h-4 bg-gray-700 mx-0.5 sm:mx-1"></div>
                        <button type="button" id="btn-new-project" class="w-6 sm:w-7 h-full flex items-center justify-center rounded hover:bg-white/10 text-gray-400 hover:text-white transition-colors" title="New Project">
                            <i class="fa-solid fa-plus text-[10px] sm:text-xs"></i>
                        </button>
                    </div>

                    <!-- History Button -->
                    <button type="button" id="btn-history" class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl hover:bg-gray-700 text-gray-400 hover:text-white transition-colors flex items-center justify-center relative shrink-0">
                        <i class="fa-solid fa-code-branch text-xs sm:text-sm"></i>
                        <span id="version-badge" class="absolute top-0.5 right-0.5 sm:top-1 sm:right-1 w-2 h-2 sm:w-2.5 sm:h-2.5 bg-blue-500 rounded-full hidden"></span>
                    </button>

                    <!-- Spacer -->
                    <div class="flex-1"></div>

                    <!-- Model Selector -->
                    <button type="button" id="btn-model-selector" class="h-8 sm:h-10 px-2 sm:px-3 rounded-xl bg-gray-900/60 hover:bg-gray-700 text-gray-400 hover:text-white flex items-center gap-1 sm:gap-1.5 transition-colors text-[11px] sm:text-xs border border-gray-700/50" title="Select Model">
                        <i id="mode-icon" class="fa-solid fa-bolt text-[9px] sm:text-[10px]"></i>
                        <span id="model-display" class="truncate max-w-[50px] sm:max-w-[100px]">Claude 3.5</span>
                    </button>

                    <!-- Settings Button -->
                    <button type="button" id="btn-settings" class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl hover:bg-gray-700 text-gray-400 hover:text-white flex items-center justify-center transition-colors shrink-0" title="Settings">
                        <i class="fa-solid fa-cog text-xs sm:text-sm"></i>
                    </button>
                </div>

                <!-- Bottom Row: Input + Send -->
                <div class="flex items-end gap-1.5 sm:gap-2">
                    <!-- Input Area -->
                    <div class="flex-1 bg-gray-900/50 rounded-xl border border-gray-700/50 min-h-[40px] sm:min-h-[48px] flex items-center relative transition-all focus-within:ring-2 focus-within:ring-blue-500/50 focus-within:bg-gray-900">
                        <textarea id="prompt-input" rows="1" placeholder="Describe your website..." class="w-full bg-transparent text-white placeholder-gray-500 text-sm p-2.5 sm:p-3 pr-20 sm:pr-24 focus:outline-none resize-none overflow-hidden max-h-32 font-inter leading-relaxed select-text"></textarea>

                        <!-- Project Health Indicator -->
                        <button type="button" id="btn-health" class="absolute right-[4.5rem] sm:right-[5.5rem] bottom-1.5 sm:bottom-2 h-6 sm:h-7 px-1.5 rounded-lg text-[10px] sm:text-xs border hidden items-center gap-1 transition-colors" title="Project Health">
                            <i class="fa-solid fa-triangle-exclamation text-[9px] sm:text-[10px]"></i>
                            <span id="health-label" class="hidden sm:inline">5k+</span>
                        </button>

                        <!-- Agent Mode Toggle (injected by JS) -->
                        <!-- Mobile: right-[2.5rem], Desktop: right-[3rem] -->

                        <!-- Voice Input Button -->
                        <button type="button" id="btn-mic" class="absolute right-1.5 sm:right-2 bottom-1.5 sm:bottom-2 w-7 h-7 sm:w-8 sm:h-8 rounded-full hover:bg-gray-700 text-gray-400 hover:text-white flex items-center justify-center transition-colors">
                            <i class="fa-solid fa-microphone text-xs sm:text-sm"></i>
                        </button>
                    </div>

                    <!-- Send Button -->
                    <button type="button" id="btn-send" class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-900/20 flex items-center justify-center transition-all disabled:opacity-50 disabled:cursor-not-allowed shrink-0">
                        <i class="fa-solid fa-paper-plane text-sm sm:text-lg"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full shadow-xl text-sm opacity-0 transition-opacity duration-300 pointer-events-none z-50 flex items-center gap-2 border border-gray-700">
        <i class="fa-solid fa-info-circle text-blue-400"></i>
        <span id="toast-msg">Notification</span>
    </div>

    <!-- Modals are now injected by JS -->

    <script type="module" src="app.js"></script>
</body>
</html>
